[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-local-brain"
version = "0.1.0"
description = "A private, local-first conversational brain powered by Ollama."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools.packages.find]
include = ["nexus*"]

[tool.unittest]
start-directory = "tests"
